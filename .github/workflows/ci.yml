name: MoonTrace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: moon update

      - name: Type check
        run: moon check --target native

      - name: Run tests
        run: moon test --target native

      - name: Replay an Agent offline
        run: |
          mkdir -p "$RUNNER_TEMP/moontrace-replay"
          MOONTRACE_DIR="$RUNNER_TEMP/moontrace-replay" moon run examples/replay_agent --target native

      - name: Build native targets
        run: moon build --target native

      - name: Verify multi-process persistence and offline workflows
        run: python3 scripts/verify_native.py
