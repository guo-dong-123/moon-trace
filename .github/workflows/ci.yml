name: MoonTrace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: moon update

      - name: Type check
        run: moon check --target native

      - name: Run tests
        run: moon test --target native

      - name: Check regression CLI
        run: |
          mkdir -p "$RUNNER_TEMP/moontrace-regress"
          export MOONTRACE_DIR="$RUNNER_TEMP/moontrace-regress"
          moon run examples/research_agent --target native
          moon run src/cli regress trace_1 trace_15
          if moon run src/cli regress trace_1 trace_8; then
            echo "Expected regression check to fail" >&2
            exit 1
          else
            test "$?" -eq 1
          fi

      - name: Build native targets
        run: moon build --target native
